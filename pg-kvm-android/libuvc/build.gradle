apply plugin: 'com.android.library'

android {
  namespace "com.jiangdg.ausbc"
  compileSdkVersion Configurations.compileSdk
  ndkVersion Configurations.ndkVersion

//    compileOptions {
//        sourceCompatibility rootProject.ext.javaSourceCompatibility
//        targetCompatibility rootProject.ext.javaTargetCompatibility
//    }

    defaultConfig {
        minSdkVersion Configurations.minSdk
        targetSdkVersion Configurations.targetSdk

        // CMake external native build configuration
        externalNativeBuild {
            cmake {
                // Pass arguments to CMake
                arguments "-DANDROID_STL=c++_shared"
                // Build all four ABIs
                abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'MissingTranslation'
    }

    buildTypes {
        debug {
            minifyEnabled false
            // Native debug: Build with Debug type (symbols, no optimization, logging enabled)
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
            // Package native debug symbols (.so files with debug info)
            packagingOptions {
                doNotStrip "**/*.so"
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
    }

    // Point to the CMakeLists.txt location
    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
            version "3.10.2"
        }
    }
}

dependencies {
    implementation fileTree(dir: new File(buildDir, 'libs'), include: '*.jar')
    implementation "androidx.appcompat:appcompat:1.3.1"
    implementation 'com.elvishew:xlog:1.11.0'
}